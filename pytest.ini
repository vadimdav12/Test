[pytest]
# Корневая директория
testpaths = tests

# Асинхронный режим
asyncio_mode = auto

# Маркеры тестов
markers =
    unit: Блочные тесты
    integration: Интеграционные тесты
    acceptance: Приёмочные тесты
    load: Нагрузочные тесты
    slow: Медленные тесты

# Вывод
addopts = -v --tb=short

# Фильтрация предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Минимальная версия pytest
minversion = 7.0
